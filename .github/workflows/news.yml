name: Radar tech → Telegram

on:
  schedule:
    # UTC. El Salvador es UTC-6 → 06:00, 10:00, 14:00 y 18:00 hora local.
    # GitHub puede retrasar los cron hasta ~15 min en horas pico; por eso
    # lookback_hours (6) es mayor que el intervalo (4).
    - cron: "0 12,16,20,0 * * *"
  workflow_dispatch:  # botón "Run workflow" para probar a demanda

# Un solo run a la vez: dos corridas en paralelo pelearían por el commit de estado.
concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write  # necesario para commitear state/seen.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Enviar noticias
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m src.main

      - name: Guardar estado de deduplicación
        run: |
          if git diff --quiet -- state/; then
            echo "Sin cambios en el estado."
            exit 0
          fi
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/
          git commit -m "chore(state): notas enviadas $(date -u +%Y-%m-%dT%H:%MZ)"
          # Otra corrida pudo haber commiteado mientras tanto: rebase antes de push.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
